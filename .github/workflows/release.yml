name: Release
run-name: Release (${{ inputs.bump }}, dry run=${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Validate and attest a candidate without publishing
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  security:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  publish:
    name: Prepare, attest, and publish
    needs: [quality, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Select the next version and generate the changelog
        env:
          BUMP: ${{ inputs.bump }}
        run: nix develop -c node scripts/prepare-release.mjs "$BUMP" "$RUNNER_TEMP/release"
      - name: Build the release archive
        run: |
          nix build --out-link result
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C result -czf "$RUNNER_TEMP/release/ajolis.tar.gz" .
          cd "$RUNNER_TEMP/release"
          sha256sum ajolis.tar.gz release.json > SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/release.json
            ${{ runner.temp }}/release/ajolis.tar.gz
      - name: Verify the workflow identity and source commit
        run: |
          nix develop -c gh attestation verify "$RUNNER_TEMP/release/release.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Retain the release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish the immutable release
        if: ${{ !inputs.dry_run }}
        run: nix develop -c node scripts/publish-release.mjs "$RUNNER_TEMP/release"
      - name: Summarize the release candidate
        run: |
          {
            cat "$RUNNER_TEMP/release/CHANGELOG.md"
            echo 'Release metadata:'
            echo '```json'
            cat "$RUNNER_TEMP/release/release.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
