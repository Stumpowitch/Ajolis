name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install locked JavaScript dependencies
        run: nix develop -c just install
      - name: Verify release candidate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_SIGNERS: ${{ vars.RELEASE_SIGNERS }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: nix develop -c node scripts/verify-release.mjs "$RELEASE_TAG"
      - name: Check source and build
        run: nix develop -c just validate
      - name: Check the flake and sandboxed website build
        run: nix flake check --print-build-logs
      - name: Package the production build for inspection
        run: |
          nix build --out-link result
          tar -C result -czf "$RUNNER_TEMP/ajolis-candidate.tar.gz" .
      - name: Retain the candidate artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ajolis-candidate.tar.gz
          retention-days: 30
          if-no-files-found: error
